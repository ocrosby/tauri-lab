[package]
name = "ipc-commands"
version = "0.1.0"
description = "tauri-lab demo 02: commands, async, managed state"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ipc_commands_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
