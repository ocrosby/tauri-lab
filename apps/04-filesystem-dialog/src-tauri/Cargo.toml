[package]
name = "filesystem-dialog"
version = "0.1.0"
description = "tauri-lab demo 04: fs + dialog plugins with scoped permissions"
edition = "2021"
rust-version = "1.77"

[lib]
name = "filesystem_dialog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
