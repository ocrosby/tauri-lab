<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filesystem &amp; dialog</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Filesystem &amp; dialog</h1>
      <div class="toolbar">
        <button id="open">Open…</button>
        <button id="save">Save as…</button>
        <button id="save-appdata">Save to app data</button>
        <button id="load-appdata">Load from app data</button>
      </div>
      <textarea id="editor" placeholder="Type here, then Save as…"></textarea>
      <p id="status">ready</p>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
