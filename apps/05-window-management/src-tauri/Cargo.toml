[package]
name = "window-management"
version = "0.1.0"
description = "tauri-lab demo 05: multi-window and custom titlebar"
edition = "2021"
rust-version = "1.77"

[lib]
name = "window_management_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
