[package]
name = "tray-notifications"
version = "0.1.0"
description = "tauri-lab demo 06: system tray + native notifications"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tray_notifications_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
