<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tray &amp; notifications</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Tray &amp; notifications</h1>
      <p>
        Closing this window hides it. The app stays alive in the tray. Use the
        tray menu or the button below to bring it back.
      </p>
      <button id="notify">Send notification</button>
      <p id="status">ready</p>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
