[package]
name = "http-plugin"
version = "0.1.0"
description = "tauri-lab demo 07: HTTP requests via tauri-plugin-http"
edition = "2021"
rust-version = "1.77"

[lib]
name = "http_plugin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
