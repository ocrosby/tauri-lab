[package]
name = "threejs-lighting-materials"
version = "0.1.0"
description = "tauri-lab demo 09: Three.js PBR materials, lights, shadows"
edition = "2021"
rust-version = "1.77"

[lib]
name = "threejs_lighting_materials_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
