[package]
name = "threejs-instancing"
version = "0.1.0"
description = "tauri-lab demo 11: Three.js InstancedMesh at 100k instances"
edition = "2021"
rust-version = "1.77"

[lib]
name = "threejs_instancing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
